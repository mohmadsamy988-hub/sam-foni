<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SamTech | متجر سام تيك للإكسسوارات وقطع الغيار</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* ستايل المود المظلم والفخم (Tech-Dark) */
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-color: #deff9a; /* الأخضر الفوسفوري المميز لـ SamTech */
            --text-color: #c5c6c7;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* الهيدر واللوجو */
        header {
            background-color: #151922;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--white);
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--accent-color);
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            background-color: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        /* قسم تسجيل الدخول السلس برقم التليفون */
        .auth-container {
            background-color: var(--card-bg);
            max-width: 450px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #333;
            display: none; /* بيظهر لما العميل يضغط دخول */
        }

        .auth-container.active {
            display: block;
        }

        .auth-container h3 {
            color: var(--white);
            margin-bottom: 15px;
        }

        .auth-container input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #45f3ff;
            background: #0f1115;
            color: #fff;
            text-align: center;
        }

        /* شبكة المنتجات */
        .container {
            padding: 40px 5%;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2c3540;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #0f1115;
        }

        .product-info {
            padding: 15px;
            text-align: center;
        }

        .product-title {
            color: var(--white);
            font-size: 18px;
            margin-bottom: 10px;
        }

        .product-price {
            color: var(--accent-color);
            font-weight: 700;
            font-size: 20px;
            margin-bottom: 15px;
        }

        /* السلة العائمة */
        .cart-badge {
            position: relative;
        }

        .cart-count {
            position: absolute;
            top: -10px;
            right: -10px;
            background-color: red;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SAM<span>TECH</span></div>
        <div class="nav-buttons">
            <button class="btn" onclick="toggleAuth()"><i class="fa-solid fa-user"></i> دخول برقم الهاتف</button>
            <button class="btn cart-badge">
                <i class="fa-solid fa-basket-shopping"></i> السلة
                <span class="cart-count" id="cartCount">0</span>
            </button>
        </div>
    </header>

    <div class="auth-container" id="authBox">
        <h3>تسجيل دخول سريع</h3>
        <p>ادخل رقم تليفونك وهيجيلك كود تفعيل فوراً</p>
        <div id="phoneSection">
            <input type="tel" id="phoneNumber" placeholder="01xxxxxxxxx">
            <button class="btn" style="width: 100%;" onclick="sendOTP()">إرسال كود التحقق</button>
        </div>
        <div id="otpSection" style="display: none;">
            <input type="text" id="otpCode" placeholder="أدخل الكود المكون من 6 أرقام">
            <button class="btn" style="width: 100%;" onclick="verifyOTP()">تأكيد الدخول</button>
        </div>
    </div>

    <div class="container">
        <h2 style="color: var(--white); border-right: 4px solid var(--accent-color); padding-right: 10px;">أحدث المنتجات وقطع الغيار</h2>
        <div class="products-grid" id="productsContainer">
            <p style="color: var(--text-color);">جاري تحميل المنتجات الفخمة...</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        // 1. إعدادات ربط جوجل شيتس (حط رابط الـ API بتاع الشيت بتاعك هنا)
        const GOOGLE_SHEETS_API = "رابط_جوجل_شيت_بتاعك_هنا";

        // جلب الداتا وعرضها في الموقع
        async function loadProducts() {
            try {
                const response = await fetch(GOOGLE_SHEETS_API);
                const data = await response.json();
                const container = document.getElementById('productsContainer');
                container.innerHTML = ''; // مسح كلمة جاري التحميل

                // التكرار على المنتجات وعرضها
                data.forEach(product => {
                    container.innerHTML += `
                        <div class="product-card">
                            <img src="${product.image || 'https://via.placeholder.com/250'}" class="product-img" alt="${product.title}">
                            <div class="product-info">
                                <h4 class="product-title">${product.title}</h4>
                                <div class="product-price">${product.price} ج.م</div>
                                <button class="btn" onclick="addToCart('${product.id}')" style="width: 100%;">إضافة للسلة <i class="fa-solid fa-cart-plus"></i></button>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("خطأ في جلب بيانات المنتجات:", error);
                // عرض منتجات تجريبية لو الرابط لسه مكنش شغال عشان شكل الموقع يبان
                showMockProducts();
            }
        }

        // منتجات تجريبية للـ Preview فقط
        function showMockProducts() {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';
            const mockData = [
                {id: 1, title: "شاشة آيفون 15 بروميوم COF", price: 4500, image: "https://images.unsplash.com/photo-1601784551146-cc0845e7c193?w=500"},
                {id: 2, title: "باور بانك فاست تشارج 20,000 مللي أمبير", price: 1200, image: "https://images.unsplash.com/photo-1609592424209-dd967241897a?w=500"},
                {id: 3, title: "شاحن فولت سريع 45 واط", price: 650, image: "https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=500"}
            ];
            mockData.forEach(product => {
                container.innerHTML += `
                    <div class="product-card">
                        <img src="${product.image}" class="product-img">
                        <div class="product-info">
                            <h4 class="product-title">${product.title}</h4>
                            <div class="product-price">${product.price} ج.م</div>
                            <button class="btn" onclick="addToCart('${product.id}')" style="width: 100%;">إضافة للسلة <i class="fa-solid fa-cart-plus"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        // 2. إدارة السلة (Local Storage) عشان المنتجات متضيعش لو العميل قفل أو سجل دخول
        let cart = JSON.parse(localStorage.getItem('samtech_cart')) || [];
        updateCartCount();

        function addToCart(productId) {
            cart.push(productId);
            localStorage.setItem('samtech_cart', JSON.stringify(cart));
            updateCartCount();
            alert("تم إضافة المنتج للسلة بنجاح! 🛒");
        }

        function updateCartCount() {
            document.getElementById('cartCount').innerText = cart.length;
        }

        // 3. أزرار شاشة الدخول
        function toggleAuth() {
            const authBox = document.getElementById('authBox');
            authBox.classList.toggle('active');
        }

        function sendOTP() {
            const phone = document.getElementById('phoneNumber').value;
            if(!phone) return alert("اكتب رقم التليفون الأول يا فنان");
            
            // هنا السيستم بيبعت الرسالة، وبنقلب الشاشة لكتابة الكود
            document.getElementById('phoneSection').style.display = 'none';
            document.getElementById('otpSection').style.display = 'block';
        }

        function verifyOTP() {
            const code = document.getElementById('otpCode').value;
            if(!code) return alert("اكتب الكود اللي جالك");
            
            alert("تم تسجيل الدخول بنجاح! وسلتك محفوظة وموجودة زي ما هي 🤝");
            toggleAuth();
        }

        // تشغيل جلب المنتجات أول ما الموقع يفتح
        window.onload = loadProducts;
    </script>
</body>
</html>
