<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر سامفون الذكي - SAMFONI</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --primary-color: #2563eb;
            --accent-color: #f97316;
            --text-color: #e4e4e7;
            --text-muted: #a1a1aa;
            --border-color: #2d2d34;
            --success-color: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* الهيدر وتظبيط اللوجو في القلب */
        header { text-align: center; margin-bottom: 20px; padding: 15px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .logo-img { width: 180px; height: auto; max-width: 100%; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.1); }
        header h1 { font-size: 22px; color: #fff; font-weight: 700; }
        header p { color: var(--text-muted); font-size: 13px; margin-top: 3px; }
        
        .main-layout { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; width: 100%; }
        .content-area { flex: 1; min-width: 300px; }
        
        .tabs-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px; background-color: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 15px; transition: all 0.2s; text-align: center; }
        .tab-btn.active { background-color: var(--primary-color); color: #fff; border-color: var(--primary-color); }
        
        .controls-container { background-color: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px; }
        .search-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .search-bar { flex: 1; padding: 12px; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-color); font-size: 16px; outline: none; }
        .refresh-btn { background-color: #27272a; color: var(--text-color); border: 1px solid var(--border-color); padding: 0 15px; border-radius: 8px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        
        .filters { display: flex; gap: 10px; }
        .filters select { flex: 1; padding: 10px; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-color); font-size: 14px; outline: none; }
        
        .parts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .part-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; border-bottom: 3px solid var(--border-color); }
        .part-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .brand-badge { background-color: var(--primary-color); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .quality-badge { background-color: #27272a; color: var(--text-muted); padding: 2px 8px; border-radius: 4px; font-size: 11px; border: 1px solid var(--border-color); }
        .part-title { font-size: 17px; font-weight: 600; margin-bottom: 4px; color: #fff; }
        .part-model { font-size: 13px; color: var(--text-muted); margin-bottom: 15px; }
        .part-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 12px; }
        .part-price { font-size: 18px; font-weight: 700; color: var(--accent-color); }
        .add-to-cart-btn { background-color: var(--primary-color); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
        
        .cart-sidebar { width: 320px; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; position: sticky; top: 15px; min-width: 300px; }
        .cart-title { font-size: 18px; font-weight: 700; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; display: flex; justify-content: space-between; }
        .cart-items { max-height: 280px; overflow-y: auto; margin-bottom: 15px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--border-color); font-size: 13px; }
        .cart-item-controls { display: flex; align-items: center; gap: 6px; }
        .cart-qty-btn { background-color: #27272a; border: 1px solid var(--border-color); color: #fff; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; }
        .cart-item-price { color: var(--accent-color); font-weight: bold; margin-right: 5px; }
        
        .cart-totals { border-top: 1px solid var(--border-color); padding-top: 12px; margin-bottom: 15px; font-size: 14px; }
        .totals-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .shipping-input { width: 65px; background: var(--bg-color); border: 1px solid var(--border-color); color: #fff; border-radius: 4px; padding: 2px 5px; text-align: center; }
        
        .checkout-btn { background-color: var(--success-color); color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 15px; }
        .loading { text-align: center; color: var(--text-muted); padding: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <img src="https://images2.imgbox.com/71/34/86GZJpE9_o.png" alt="SAMFONI Logo" class="logo-img">
        <h1>منصة سامفون الذكية 📱</h1>
        <p>قطع غيار صيانة الموبيلات والإكسسوارات للفنيين</p>
    </header>

    <div class="main-layout">
        
        <div class="content-area">
            <div class="tabs-container">
                <div class="tab-btn active" id="tabInternal" onclick="switchTab('internal')">⚙️ قطع غيار (داخلي)</div>
                <div class="tab-btn" id="tabExternal" onclick="switchTab('external')">🎒 إكسسوارات (خارجي)</div>
            </div>

            <div class="controls-container">
                <div class="search-row">
                    <input type="text" id="searchInp" class="search-bar" placeholder="ابحث برقم الموديل أو اسم القطعة...">
                    <button class="refresh-btn" id="refreshBtn" title="تحديث البيانات">🔄</button>
                </div>
                <div class="filters">
                    <select id="brandFilter">
                        <option value="">كل الشركات</option>
                        <option value="Apple">Apple</option>
                        <option value="Samsung">Samsung</option>
                        <option value="Xiaomi">Xiaomi</option>
                        <option value="Oppo">Oppo</option>
                    </select>
                    <select id="qualityFilter">
                        <option value="">كل الجودات / الأنواع</option>
                        <option value="أصلي خلع">أصلي خلع</option>
                        <option value="أصلي توكيل">أصلي توكيل</option>
                        <option value="هاي كوبي">هاي كوبي</option>
                    </select>
                </div>
            </div>

            <div id="loading" class="loading">⏳ جاري سحب أحدث الأسعار... إذا علقت الشاشة اضغط 🔄</div>
            <div id="partsGrid" class="parts-grid"></div>
        </div>

        <div class="cart-sidebar">
            <div class="cart-title">
                <span>🛒 سلة الطلبات</span>
                <span id="cartCount" style="font-size:12px; background:var(--primary-color); padding:2px 8px; border-radius:20px;">0</span>
            </div>
            <div class="cart-items" id="cartItems">
                <p style="text-align:center; color:var(--text-muted); padding:20px;">السلة فارغة حالياً</p>
            </div>
            <div class="cart-totals">
                <div class="totals-row">
                    <span>إجمالي المنتجات:</span>
                    <span id="itemsTotal">0 ج.م</span>
                </div>
                <div class="totals-row">
                    <span>مصاريف الشحن:</span>
                    <input type="number" id="shippingCost" class="shipping-input" value="50" oninput="updateCartUI()">
                </div>
                <div class="totals-row" style="font-weight:700; color:var(--accent-color); font-size:16px; border-top:1px dashed var(--border-color); padding-top:8px;">
                    <span>الحساب الإجمالي:</span>
                    <span id="finalTotal">0 ج.م</span>
                </div>
            </div>
            <button class="checkout-btn" onclick="sendOrderToWhatsApp()">🟢 تأكيد الطلب وإرسال واتساب</button>
        </div>

    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwoSVwewTUTT14T7Lc8qSRKuU7sDwrNceUCxwkdnURd2Ow2Tze6KVEAOwNT5S7bKwM-aA/exec"; 
        const phone = "201012364554"; 
        
        let allProducts = [];
        let cart = []; 
        let currentTab = 'internal';

        async function fetchParts() {
            const loadingDiv = document.getElementById('loading');
            loadingDiv.style.display = 'block';
            loadingDiv.innerText = "⏳ جاري سحب الأسعار حالياً...";
            try {
                const response = await fetch(`${API_URL}?nocache=${new Date().getTime()}`);
                allProducts = await response.json();
                loadingDiv.style.display = 'none';
                filterAndRender();
            } catch (error) {
                loadingDiv.innerHTML = "⚠️ معلق اتصال بالسيرفر المباشر. <br>اضغط على زر التحديث 🔄 لتنشيط المحرك وعرض العناصر.";
                console.error(error);
                filterAndRender(); 
            }
        }

        function switchTab(tabName) {
            currentTab = tabName;
            document.getElementById('tabInternal').classList.toggle('active', tabName === 'internal');
            document.getElementById('tabExternal').classList.toggle('active', tabName === 'external');
            filterAndRender();
        }

        function filterAndRender() {
            const grid = document.getElementById('partsGrid');
            if(!allProducts || allProducts.length === 0) {
                grid.innerHTML = `<div style="text-align:center; width:100%; color:var(--text-muted); padding: 30px; background: var(--card-bg); border-radius:12px; border:1px dashed var(--border-color)">📭 اضغط زر التحديث 🔄 لتنشيط السيرفر وعرض المنتجات.</div>`;
                return;
            }
            
            const searchVal = document.getElementById('searchInp').value.toLowerCase();
            const brandVal = document.getElementById('brandFilter').value;
            const qualityVal = document.getElementById('qualityFilter').value;

            const filtered = allProducts.filter(item => {
                const name = String(item.Part_Name || '').toLowerCase();
                const quality = String(item.Quality || '').toLowerCase();
                const model = String(item.Model || '').toLowerCase();
                const brand = String(item.Brand || '');

                const isExternalItem = name.includes('جراب') || name.includes('اسكرين') || name.includes('شاحن') || quality.includes('جراب') || quality.includes('اسكرين');
                if (currentTab === 'internal' && isExternalItem) return false;
                if (currentTab === 'external' && !isExternalItem) return false;

                return (name.includes(searchVal) || model.includes(searchVal)) && (brandVal === "" || brand.toLowerCase() === brandVal.toLowerCase()) && (qualityVal === "" || quality === qualityVal);
            });
            renderProducts(filtered);
        }

        function renderProducts(products) {
            const grid = document.getElementById('partsGrid');
            grid.innerHTML = '';
            if(products.length === 0) {
                grid.innerHTML = `<div style="text-align:center; width:100%; color:var(--text-muted); padding: 20px;">لا توجد عناصر متوفرة في هذا القسم.</div>`;
                return;
            }
            products.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'part-card';
                card.innerHTML = `
                    <div>
                        <div class="part-header">
                            <span class="brand-badge">${item.Brand || 'عام'}</span>
                            <span class="quality-badge">${item.Quality || 'ممتاز'}</span>
                        </div>
                        <div class="part-title">${item.Part_Name || ''}</div>
                        <div class="part-model">${item.Model || ''}</div>
                    </div>
                    <div class="part-footer">
                        <div class="part-price">${item.Price_Total || 0} ج.م</div>
                        <button class="add-to-cart-btn" onclick="addToCart('${item.Part_Name}', '${item.Model}', ${item.Price_Total})">➕ للسلة</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function addToCart(name, model, price) {
            const existingItem = cart.find(item => item.name === name && item.model === model);
            if(existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ name, model, price, qty: 1 });
            }
            updateCartUI();
        }

        function changeQty(index, amount) {
            cart[index].qty += amount;
            if(cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartItemsDiv = document.getElementById('cartItems');
            const cartCount = document.getElementById('cartCount');
            const itemsTotal = document.getElementById('itemsTotal');
            const finalTotal = document.getElementById('finalTotal');
            const shippingCost = Number(document.getElementById('shippingCost').value) || 0;

            cartItemsDiv.innerHTML = '';
            
            if(cart.length === 0) {
                cartItemsDiv.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:20px;">السلة فارغة حالياً</p>';
                cartCount.innerText = 0;
                itemsTotal.innerText = '0 ج.م';
                finalTotal.innerText = '0 ج.م';
                return;
            }

            let totalProductsPrice = 0;
            let totalCount = 0;

            cart.forEach((item, index) => {
                totalProductsPrice += (item.price * item.qty);
                totalCount += item.qty;

                const row = document.createElement('div');
                row.className = 'cart-item';
                row.innerHTML = `
                    <div class="cart-item-info">
                        <div><b>${item.name}</b></div>
                        <div style="font-size:11px; color:var(--text-muted)">${item.model}</div>
                    </div>
                    <div class="cart-item-controls">
                        <button class="cart-qty-btn" onclick="changeQty(${index}, -1)">-</button>
                        <span style="font-weight: bold; min-width:15px; text-align:center;">${item.qty}</span>
                        <button class="cart-qty-btn" onclick="changeQty(${index}, 1)">+</button>
                        <span class="cart-item-price" style="margin-right:8px;">${item.price * item.qty} ج.م</span>
                    </div>
                `;
                cartItemsDiv.appendChild(row);
            });

            cartCount.innerText = totalCount;
            itemsTotal.innerText = `${totalProductsPrice} ج.م`;
            finalTotal.innerText = `${totalProductsPrice + shippingCost} ج.م`;
        }

        function sendOrderToWhatsApp() {
            if(cart.length === 0) {
                alert('سلتك فارغة! أضف بضاعة أولاً قبل إرسال الطلب.');
                return;
            }

            let message = `*طلب شراء جديد من متجر SAMFONI 🛒*\n`;
            message += `-----------------------------------\n`;
            
            cart.forEach((item, index) => {
                message += `${index + 1}- *القطعة:* ${item.name}\n`;
                message += `   *الموديل:* ${item.model}\n`;
                message += `   *الكمية:* ${item.qty} × *السعر:* ${item.price} ج.م\n`;
                message += `-----------------------------------\n`;
            });

            const shippingCost = Number(document.getElementById('shippingCost').value) || 0;
            const itemsTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            message += `*إجمالي البضاعة:* ${itemsTotal} ج.م\n`;
            message += `*مصاريف الشحن:* ${shippingCost} ج.م\n`;
            message += `👉 *الحساب النهائي المطلوب:* ${itemsTotal + shippingCost} ج.م\n\n`;
            message += `_برجاء مراجعة الطلب وتأكيد الشحن يا هندسة!_`;

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${phone}?text=${encodedMessage}`, '_blank');
        }

        document.getElementById('searchInp').addEventListener('input', filterAndRender);
        document.getElementById('brandFilter').addEventListener('change', filterAndRender);
        document.getElementById('qualityFilter').addEventListener('change', filterAndRender);
        document.getElementById('refreshBtn').addEventListener('click', fetchParts);
        fetchParts();
    </script>
</body>
</html>
